name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  minimum-node-runtime:
    name: Minimum Node 18.13 runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare runtime artifacts with the development toolchain
        uses: actions/setup-node@v5
        with:
          node-version: '23'

      - name: Install dependencies
        run: npm ci

      - name: Build CommonJS
        run: npm run build-cjs

      - name: Select the minimum supported Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: '18.13.0'

      - name: Smoke test ESM and CommonJS exports
        run: npm run test-node-minimum

  publish:
    needs: minimum-node-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '23'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run:  npx playwright install --with-deps

      - name: Build CJS and browser bundles
        run: npm run build-cjs && npm run build-browser

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then
            PREID=$(echo "$VERSION" | sed 's/.*-\([^.]*\)\..*/\1/')
            npm publish --provenance --access public --tag "$PREID"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
